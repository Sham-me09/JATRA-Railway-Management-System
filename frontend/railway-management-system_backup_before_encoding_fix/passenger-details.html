<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Passenger Information - Railway JATRA: RAILWAY MANAGEMENT SYSTEM</title>
    <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            navy: {
              900: '#0f172a',
              800: '#1e293b',
              700: '#334155'
            },
            sky: {
              bright: '#38bdf8',
              light: '#e0f2fe',
              subtle: '#f0f9ff'
            },
            accent: {
              blue: '#0284c7',
              hover: '#0369a1'
            }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="container navbar-container">
      <a href="index.html" class="brand-logo" id="brandLogoLink">
        <svg fill="currentColor" viewBox="0 0 24 24"><path d="M12 2c-4 0-8 .5-8 4v9.5C4 17.43 5.57 19 7.5 19L6 20.5v.5h12v-.5L16.5 19c1.93 0 3.5-1.57 3.5-3.5V6c0-3.5-4-4-8-4zm0 2c3.71 0 5.82.42 6 2H6c.18-1.58 2.29-2 6-2zm-4.5 13c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5-1.5zm9 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5-1.5zm1.5-5H6V8h12v4z"/></svg>
        <span>JATRA: RAILWAY MANAGEMENT SYSTEM</span>
      </a>

      <button class="mobile-nav-toggle" id="mobileNavToggle" aria-label="Toggle Navigation">☰</button>

      <ul class="nav-menu" id="navMenu">
        <li><a href="index.html" class="nav-link">Home</a></li>
        <li><a href="search-train.html" class="nav-link active">Search Trains</a></li>
        <li><a href="my-tickets.html" class="nav-link">My Tickets</a></li>
        <li><a href="complaint.html" class="nav-link">Complaints</a></li>
      </ul>

      <div class="nav-actions" id="navActions"></div>
    </div>
  </nav>

  <div class="container" style="padding: 2.5rem 1.5rem; min-height: 80vh;">
    <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 2rem;" class="form-row">
      
      <!-- Passenger Details Form Column -->
      <div class="card">
        <h2>Passenger Contact & Verification Details</h2>
        <p style="font-size: 0.9rem; color: var(--text-muted);">Please provide passenger details as per National ID or Student ID card.</p>

        <form id="passengerDetailsForm" style="margin-top: 1.5rem;">
          <div class="form-group">
            <label class="form-label" for="pName">Passenger Full Name</label>
            <input type="text" id="pName" class="form-control" placeholder="e.g. Rahim Ahmed" required>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="pAge">Age (Years)</label>
              <input type="number" id="pAge" class="form-control" placeholder="28" min="1" max="110" required>
            </div>

            <div class="form-group">
              <label class="form-label" for="pGender">Gender</label>
              <select id="pGender" class="form-select" required>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
              </select>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="pPhone">Contact Phone Number</label>
              <input type="tel" id="pPhone" class="form-control" placeholder="01711223344" required>
            </div>

            <div class="form-group">
              <label class="form-label" for="pType">Passenger Category</label>
              <select id="pType" class="form-select" required>
                <option value="Adult">Adult (Standard)</option>
                <option value="Child">Child</option>
                <option value="Senior">Senior Citizen</option>
                <option value="Student">Student</option>
              </select>
            </div>
          </div>

          <button type="submit" id="passengerSubmitBtn" class="btn btn-primary btn-lg btn-full" style="margin-top: 1rem;">
            Continue to Secure Payment →
          </button>
        </form>
      </div>

      <!-- Selected Trip Overview -->
      <div class="card" id="passengerBookingSummary" style="height: fit-content;">
        <!-- Injected by booking.js -->
      </div>

    </div>
  </div>

  <footer class="footer">
    <div class="container text-center">
      <p>&copy; 2026 Bangladesh JATRA: RAILWAY MANAGEMENT SYSTEM.</p>
    </div>
  </footer>

  <script src="js/main.js"></script>
  <script src="js/booking.js"></script>
</body>
</html>
