<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maintenance Management - Railway Admin Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            navy: {
              900: '#0f172a',
              800: '#1e293b',
              700: '#334155'
            },
            sky: {
              bright: '#38bdf8',
              light: '#e0f2fe',
              subtle: '#f0f9ff'
            },
            accent: {
              blue: '#0284c7',
              hover: '#0369a1'
            }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">

  <nav class="navbar">
    <div class="container navbar-container">
      <a href="index.html" class="brand-logo" id="brandLogoLink">
        <svg fill="currentColor" viewBox="0 0 24 24"><path d="M12 2c-4 0-8 .5-8 4v9.5C4 17.43 5.57 19 7.5 19L6 20.5v.5h12v-.5L16.5 19c1.93 0 3.5-1.57 3.5-3.5V6c0-3.5-4-4-8-4zm0 2c3.71 0 5.82.42 6 2H6c.18-1.58 2.29-2 6-2zm-4.5 13c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm9 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm1.5-5H6V8h12v4z"/></svg>
        <span>RAILWAY ADMIN HQ</span>
      </a>
      <div class="nav-actions" id="navActions"></div>
    </div>
  </nav>

  <div class="dashboard-container">
    <aside class="sidebar">
      <!-- Injected by renderRoleSidebar() in main.js -->
    </aside>

    <main class="dashboard-main p-4 sm:p-8 bg-slate-900/90 text-slate-100 flex-1">
      <div class="dashboard-header mb-6">
        <div class="dashboard-title">
          <div class="flex items-center gap-2 mb-1">
            <span class="px-2.5 py-0.5 rounded-full text-xs font-bold bg-purple-500/20 text-purple-300 border border-purple-400/30">
              Fleet Engineering & Safety
            </span>
          </div>
          <h1 class="text-2xl sm:text-3xl font-extrabold text-white">Maintenance Management</h1>
          <p class="text-slate-400 text-sm">View rolling stock condition, manage depot work orders, and certify train safety</p>
        </div>
        <button id="addNewRecordBtn" class="btn btn-primary">+ Log Depot Work Order</button>
      </div>

      <div class="table-toolbar">
        <div class="toolbar-search">
          <span class="search-icon">🔍</span>
          <input type="text" id="crudSearchInput" class="form-control" placeholder="Search maintenance by train, category, target...">
        </div>
        <div class="toolbar-filters">
          <select id="crudSortSelect" class="form-select" style="width: auto;">
            <option value="desc">Sort Newest First</option>
            <option value="asc">Sort Oldest First</option>
          </select>
        </div>
      </div>

      <div class="table-responsive">
        <table class="table">
          <thead>
            <tr>
              <th>Order ID</th>
              <th>Train / Fleet Unit</th>
              <th>Category</th>
              <th>Component / Target</th>
              <th>Severity</th>
              <th>Status</th>
              <th>Date</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="crudTableBody">
            <!-- Injected by dashboard.js initAdminCrudTable -->
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <!-- CRUD Modal for Maintenance Management -->
  <div class="modal-overlay" id="crudModalOverlay">
    <div class="modal-container max-w-lg">
      <div class="modal-header">
        <h3 class="modal-title" id="crudModalTitle">Log Depot Work Order</h3>
        <button class="modal-close" id="closeCrudModalBtn">&times;</button>
      </div>
      <form id="crudModalForm">
        <div class="modal-body space-y-3 text-xs">
          <div class="form-group">
            <label class="form-label">Train / Fleet Unit Name</label>
            <input type="text" name="trainName" class="form-control" placeholder="e.g. Sonar Bangla Express (TR-701)" required>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div class="form-group">
              <label class="form-label">Maintenance Category</label>
              <select name="category" class="form-select" required>
                <option value="AC & HVAC Cooling">AC & HVAC Cooling</option>
                <option value="Brake & Pneumatic">Brake & Pneumatic</option>
                <option value="Locomotive Engine">Locomotive Engine</option>
                <option value="Coupler & Wheelset">Coupler & Wheelset</option>
                <option value="Electrical & Power">Electrical & Power</option>
                <option value="Carriage Sanitation">Carriage Sanitation</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Severity Level</label>
              <select name="severity" class="form-select" required>
                <option value="Low">Low</option>
                <option value="Medium">Medium</option>
                <option value="High">High</option>
                <option value="Critical">Critical</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Component / Target Coach / Locomotive</label>
            <input type="text" name="target" class="form-control" placeholder="e.g. Coach KA or Loco #3204" required>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div class="form-group">
              <label class="form-label">Work Status</label>
              <select name="status" class="form-select" required>
                <option value="Under Repair">Under Repair</option>
                <option value="In Progress">In Progress</option>
                <option value="Scheduled">Scheduled</option>
                <option value="Reported">Reported</option>
                <option value="Resolved">Resolved / Certified</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Logged Date</label>
              <input type="date" name="date" class="form-control" value="2026-08-28" required>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline" id="modalCancelBtn" onclick="document.getElementById('crudModalOverlay').classList.remove('active')">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Maintenance Order</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/main.js"></script>
  <script src="js/dashboard.js"></script>    <script src="js/dashboard_db.js"></script>
</body>
</html>
